name: tracekit-regression

# TraceKit 自己的回归门禁：
# 评测套件失败即流水线失败，和 Agent 应用但愿的正确性守护方式保持一致。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run regression eval suite
        run: python -m tracekit eval

      - name: Demo flow must be deterministic
        # 同一个输入跑两次，结构必须完全一致（这是diff能被信任的前提）
        run: |
          python -m tracekit demo
          python -m tracekit demo --broken && echo "diff 命令应返回非零但不应崩溃" || true
