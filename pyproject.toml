[project]
name = "pocketflow-tracekit"
version = "0.1.0"
description = "Run-level tracing, replay-diff and regression evals for minimalist agent frameworks (PocketFlow and friends)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tracekit"]
